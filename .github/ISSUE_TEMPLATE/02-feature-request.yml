name: "💡 Feature Request"
description: "Suggest a new capability or an improvement to an existing module."
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **This repository is public.** Leave out anything confidential — including your
        employer's internal processes, client names, instance URLs, or proprietary code.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the pain first, not the solution. It often leads to a better fix than the one you had in mind.
      placeholder: "I re-enter the same acceptance criteria in three modules because there's no way to carry a story across them."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which area does this relate to?
      options:
        - "Dev Modules — Pillwright Studio"
        - "Dev Modules — Flow Click-by-Click"
        - "Dev Modules — SP Widget Generator"
        - "Dev Modules — UI Builder Helper"
        - "Dev Modules — Cat Item Generator"
        - "Dev Modules — ATF Builder"
        - "Dev Modules — Code Review"
        - "Dev Modules — Snippet Manager"
        - "Ops Modules — Story Analysis"
        - "Ops Modules — Epic Detector"
        - "Ops Modules — PRD ENGINE"
        - "Ops Modules — PRD Refinement"
        - "Ops Modules — Story Pointing & Planning"
        - "Ops Modules — Task Tracker"
        - "Ops Modules — Team Standup"
        - "Ops Modules — Collaboration Hub"
        - "Ops Modules — Event Planner"
        - "Ops Modules — Meeting Time"
        - "Ops Modules — Meeting Summarizer"
        - "Ops Modules — Presentation"
        - "Ops Modules — Knowledge Base"
        - "Ops Modules — ServiceNow Job Finder"
        - "AI Orchestration — Agentic Workflow"
        - "AI Orchestration — Master Mind"
        - "Mic Modules — Agentic Master Mind"
        - "Mic Modules — Math Teacher (Montessori)"
        - "Mic Modules — Math Teacher (Kumon)"
        - "Mic Modules — Math Teacher (Standard)"
        - "Sign-in / Account"
        - "Billing & Credits"
        - "A new module"
        - "Something else / not sure"
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle this today?
      description: Your current workaround, if any.
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: How much would this help you?
      options:
        - "Would change how I work daily"
        - "Would save me time occasionally"
        - "Nice to have"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "I searched existing issues and nobody has already requested this."
          required: true
        - label: "This request contains no confidential or proprietary information."
          required: true
        - label: "I understand feature requests are considered but not guaranteed, and no timeline is implied."
          required: true
